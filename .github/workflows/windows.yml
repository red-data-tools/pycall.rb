name: Windows

on:
  push:
    branches:
    - "**"
    - '!dependabot/**'
  pull_request:

jobs:
  test:
    name: ruby-${{ matrix.ruby }}/python-${{ matrix.python }}-${{ matrix.python_architecture }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        ruby:
        - "3.3"
        - "3.2"
        - "3.1"
        - "3.0"
        - "2.7"
        python:
        - 3.x
        python_architecture:
        - x64
        include:
        # Python 3.11 with the latest Ruby
        - { ruby: "3.3" , python: 3.11 , python_architecture: x64 }
        # The development version of Ruby
        - { ruby: mingw , python: 3.x  , python_architecture: x64 }
        #- { ruby: mswin , python: 3.x , python_architecture: x64 }

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - uses: ruby/setup-ruby@v1
      if: matrix.ruby_version != 'master-nightly'
      with:
        ruby-version: ${{ matrix.ruby }}

    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python }}
        architecture: ${{ matrix.python_architecture }}

    - run: pip install --user numpy

    - run: bundle install

    - run: rake compile

    - run: python lib/pycall/python/investigator.py

    - run: rake
      env:
        PYTHON: python

  # Python installations that are not on PATH, which PyCall has to find by itself:
  # - registry-pythoncore: Python from python.org registered under Software\Python\PythonCore
  # - registry-anaconda: Miniconda registered under Software\Python\ContinuumAnalytics
  # - conda-prefix: a conda environment given by CONDA_PREFIX
  discovery:
    name: discovery:${{ matrix.source }}/ruby-${{ matrix.ruby }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        ruby:
        - "3.3"
        source:
        - registry-pythoncore
        - registry-anaconda
        - conda-prefix

    defaults:
      run:
        shell: pwsh

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}

    - run: bundle install

    - run: rake compile

    - uses: actions/setup-python@v7
      if: matrix.source == 'registry-pythoncore'
      with:
        python-version: 3.x

    - name: Expect Python registered under PythonCore
      if: matrix.source == 'registry-pythoncore'
      run: |
        $prefixes = Get-ChildItem HKCU:\Software\Python\PythonCore, HKLM:\SOFTWARE\Python\PythonCore -ErrorAction SilentlyContinue |
          ForEach-Object { (Get-ItemProperty -LiteralPath "$($_.PSPath)\InstallPath" -ErrorAction SilentlyContinue).'(default)' } |
          Where-Object { $_ }
        if (-not $prefixes) { throw 'No Python is registered under PythonCore' }
        Write-Host "Registered: $($prefixes -join ', ')"
        "EXPECTED_PYTHON_PREFIXES=$($prefixes -join ';')" >> $env:GITHUB_ENV

    - name: Install Miniconda registered as the system Python
      if: matrix.source == 'registry-anaconda'
      run: |
        # Remove the registrations of the runner image, so that only Miniconda is registered.
        Remove-Item -Recurse -Force HKLM:\SOFTWARE\Python, HKLM:\SOFTWARE\WOW6432Node\Python, HKCU:\Software\Python -ErrorAction SilentlyContinue
        $installer = Join-Path $env:RUNNER_TEMP miniconda.exe
        $prefix = Join-Path $env:RUNNER_TEMP miniconda3
        Invoke-WebRequest https://repo.anaconda.com/miniconda/Miniconda3-latest-Windows-x86_64.exe -OutFile $installer
        Start-Process -Wait -FilePath $installer -ArgumentList '/S', '/InstallationType=JustMe', '/RegisterPython=1', '/AddToPath=0', "/D=$prefix"
        reg query HKCU\Software\Python /s
        "EXPECTED_PYTHON_PREFIXES=$prefix" >> $env:GITHUB_ENV

    - uses: conda-incubator/setup-miniconda@v4
      if: matrix.source == 'conda-prefix'
      with:
        activate-environment: test
        python-version: 3.12
        channels: conda-forge
        conda-remove-defaults: true

    - name: Expect the conda environment
      if: matrix.source == 'conda-prefix'
      run: |
        conda install -y numpy
        $prefix = python -c "import sys; print(sys.prefix)"
        "EXPECTED_PYTHON_PREFIXES=$prefix" >> $env:GITHUB_ENV
        "PYCALL_TEST_CONDA_PREFIX=$prefix" >> $env:GITHUB_ENV

    - name: Find Python that is not on PATH
      run: |
        # Hide every python.exe on PATH, so that PyCall has to find Python by itself.
        $env:PATH = ($env:PATH -split ';' | Where-Object {
          $_ -and -not (Test-Path (Join-Path $_ python.exe)) -and -not (Test-Path (Join-Path $_ python3.exe))
        }) -join ';'
        if (Get-Command python, python3 -ErrorAction SilentlyContinue) { throw 'Python is still on PATH' }
        # Only the conda-prefix job sets CONDA_PREFIX.
        $env:CONDA_PREFIX = $env:PYCALL_TEST_CONDA_PREFIX
        $env:PYTHON = $null

        @'
        require 'pycall'
        puts PyCall::PYTHON_DESCRIPTION
        prefix = PyCall.sys.prefix
        puts "sys.prefix: #{prefix}"
        expected = ENV['EXPECTED_PYTHON_PREFIXES'].split(';')
        unless expected.any? {|path| File.identical?(path, prefix) }
          abort "Expected Python in #{expected.join(' or ')}, but used #{prefix}"
        end
        # These load DLLs that are next to python3XX.dll, or in Library\bin of conda.
        %w[ctypes ssl sqlite3].each {|name| PyCall.import_module(name) }
        PyCall.import_module('numpy') if ENV['PYCALL_TEST_CONDA_PREFIX']
        '@ | ruby -Ilib -Iext/pycall
        if ($LASTEXITCODE) { exit $LASTEXITCODE }

        # finder_spec.rb runs python on PATH.
        ruby -Iext/pycall -S rspec --exclude-pattern spec/pycall/libpython/finder_spec.rb
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        ruby test/run-test.rb
      env:
        PYCALL_DEBUG_FIND_LIBPYTHON: 1

  conda:
    name: conda:ruby-${{ matrix. ruby }}/python-${{ matrix.python }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        ruby:
        - "3.3"
        python:
        - 3.12
        - 3.11

    defaults:
      run:
        shell: pwsh

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - uses: conda-incubator/setup-miniconda@v4
      with:
        activate-environment: test
        python-version: ${{ matrix.python }}

    - run: set
      shell: cmd

    - name: Add conda's DLL path
      run: |
        echo $env:CONDA\Library\bin >> $GITHUB_PATH
        echo $env:CONDA_PREFIX\Library\bin >> $GITHUB_PATH

    - uses: ruby/setup-ruby@v1
      if: matrix.ruby_version != 'master-nightly'
      with:
        ruby-version: ${{ matrix.ruby }}

    - run: conda install numpy

    - run: python -c 'import numpy; print(numpy)'

    - run: python -c 'import os; print(os.environ)'

    - run: bundle install

    - run: rake compile

    - run: python lib/pycall/python/investigator.py

    - run: |
        ruby -Ilib -Iext/pycall -rpycall -e "p PyCall.sys.version"
        ruby -Ilib -Iext/pycall -rpycall -e "PyCall.import_module(:numpy)"
      env:
        PYTHON: python
      continue-on-error: true

    - run: |
        echo $env:PATH
        rake
      env:
        PYTHON: python
        CONDA_DLL_SEARCH_MODIFICATION_ENABLE: 1
      continue-on-error: true
